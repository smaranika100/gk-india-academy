<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Admin Portal | GK India Academy</title>
  <meta name="robots" content="noindex, nofollow" />
  <!-- Dynamic Environment Variables Loader -->
  <script src="/admin/env.js"></script>
  <!-- Supabase JS Client v2 from CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js"></script>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #071526;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255, 255, 255, 0.2);
      border-top-color: #f59e0b;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <p style="color: #94a3b8; font-size: 0.9rem;">Checking authorization...</p>
  <script>
    (async function () {
      try {
        const res = await AdminAuth.getCurrentSession();
        if (res.session && res.user && res.isAdmin) {
          window.location.replace('/admin/dashboard');
        } else {
          window.location.replace('/admin/login');
        }
      } catch (_) {
        window.location.replace('/admin/login');
      }
    })();
  </script>
</body>
</html>
